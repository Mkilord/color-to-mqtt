name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '22'
          cache: maven

      - name: Build and test
        run: ./mvnw -B -ntp verify -DtrimStackTrace=false 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Report errors
        if: failure()
        run: |
          # GitHub показывает не больше 10 аннотаций-ошибок на шаг, поэтому сначала самое полезное.
          grep -h -o -E 'Caused by: [^&]{0,400}' target/surefire-reports/*.xml 2>/dev/null | sort -u | tail -2 | sed 's/^/::error::/' || true
          # Упавший тест вместе с первой строкой исключения.
          awk '/<<< (FAILURE|ERROR)/ && !/Tests run/ {name=$1; getline; print name " " $0}' target/surefire-reports/*.txt 2>/dev/null | cut -c1-400 | head -5 | sed 's/^/::error::/' || true
          grep -E '^\[ERROR\] .*\.java' build.log | head -3 | sed -E 's/^\[ERROR\] ?/::error::/' || true

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
