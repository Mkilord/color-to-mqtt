<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
	<meta charset="UTF-8">
	<meta content="width=device-width, initial-scale=1" name="viewport">
	<title th:text="${title} + ' | ColorToMQTT'">ColorToMQTT</title>
	<link href="/img/logo.svg" rel="icon" type="image/svg+xml">
	<script src="/js/theme.js"></script>
	<link href="/styles/main.css" rel="stylesheet">
</head>
<body>
<header class="app-header" th:fragment="header(active)">
	<a class="brand" href="/">
		<img alt="" class="brand-logo" height="30" src="/img/logo.svg" width="30">
		<span>ColorToMQTT</span>
	</a>
	<nav aria-label="Разделы" class="app-nav">
		<a href="/" th:attr="aria-current=${active == 'home'} ? 'page'">Главная</a>
		<a href="/settings" th:attr="aria-current=${active == 'settings'} ? 'page'">Настройки</a>
	</nav>
	<button aria-label="Переключить тему" class="theme-toggle" data-theme-toggle title="Переключить тему" type="button">
		<svg aria-hidden="true" class="icon-sun" height="20" viewBox="0 0 24 24" width="20">
			<circle cx="12" cy="12" fill="none" r="4" stroke="currentColor" stroke-width="1.8"/>
			<path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"
			      stroke="currentColor" stroke-linecap="round" stroke-width="1.8"/>
		</svg>
		<svg aria-hidden="true" class="icon-moon" height="20" viewBox="0 0 24 24" width="20">
			<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor"
			      stroke-linejoin="round" stroke-width="1.8"/>
		</svg>
	</button>
</header>
<div aria-live="polite" class="toast" id="toast" role="status" th:fragment="toast"></div>
<footer class="app-footer" th:fragment="footer">
	<span>ColorToMQTT <span th:text="${appVersion}">1.0.0</span></span>
	<span>автор <a href="https://github.com/Mkilord" rel="noopener" target="_blank" th:text="${appAuthor}">mkilord</a></span>
	<a href="https://github.com/Mkilord/color-to-mqtt" rel="noopener" target="_blank">GitHub</a>
</footer>
</body>
</html>
