spring:
  application:
    name: ColorToMQTT
  web:
    resources:
      static-locations: classpath:/static/
server:
  tomcat:
    # Интерфейс открывает один человек: 200 потоков по умолчанию не нужны.
    threads:
      max: 8
      min-spare: 1
app:
  # Папка с settings.yaml и profiles. Значения профилей по умолчанию заданы в коде (ProfileSettings.DEFAULTS).
  storage-dir: .
  # Подключение до первого сохранения в интерфейсе.
  mqtt:
    broker: ${MQTT_BROKER:tcp://localhost:1883}
    topic: ${MQTT_TOPIC:colorToMQTT}
    username: ${MQTT_USERNAME:}
    password: ${MQTT_PASSWORD:}
